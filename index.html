async function loadFirebaseToLocal(){

    if(Object.keys(mig).length>0)await db.ref('seb38/data').set(mig);
  }

}

function PasswordGate({onAuth}){
  const[pw,setPw]=useState("");const[err,setErr]=useState(false);
  const cached=ld(SK.auth);
  useEffect(()=>{if(cached===true)onAuth()},[]);
  const go=()=>{if(pw===PASSWORD){sv(SK.auth,true);onAuth()}else{setErr(true);setTimeout(()=>setErr(false),2000)}};
  return(<div style={{minHeight:"100vh",background:"linear-gradient(145deg,#0a0f1e 0%,#111b33 50%,#1a1020 100%)",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center",maxWidth:400,padding:"0 24px"}}>

function Journal(){

        </div>
        <div style={{...CardS,padding:"20px 18px"}}>
          <div style={{color:"#5a6a8a",fontSize:12,fontWeight:700,letterSpacing:1,marginBottom:8}}>PRE-GAME MEALS</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:"#f39c12"}}>{entries.filter(e=>e.type==="Pre-Game").length}</div>
          <div style={{color:"#5a6a8a",fontSize:13}}>logged</div>
        </div>
      </div>
      <div style={{display:"flex",gap:12,marginBottom:24,flexWrap:"wrap",alignItems:"center"}}>
        <SB value={search} onChange={setSe} placeholder="Search meals, dates, notes..."/>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {["All",...MEAL_TYPES].map(t=><Pill key={t} label={t} active={filterType===t} onClick={()=>setFT(t)}/>)}</div></div>
      {filtered.length===0?<Empty icon="🍎" text={search||filterType!=="All"?"No matching entries.":"No meals logged yet. Track your first meal!"}/>:
        <div style={{display:"grid",gap:12}}>{filtered.map(e=>
          <div key={e.id} style={{...CardS,overflow:"hidden"}}>
            <div onClick={()=>setExp(expId===e.id?null:e.id)} style={{padding:"18px 22px",display:"flex",alignItems:"center",gap:16,cursor:"pointer"}}>
              <div style={{width:44,height:44,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:(typeColor[e.type]||"#5a6a8a")+"22",color:typeColor[e.type]||"#5a6a8a",fontSize:20,flexShrink:0,border:"1px solid "+(typeColor[e.type]||"#5a6a8a")+"44"}}>🥗</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:"#fff",fontWeight:700,fontSize:15,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.meal}</div>
                <div style={{color:"#5a6a8a",fontSize:13,marginTop:2}}>{e.date} · <span style={{color:typeColor[e.type]||"#5a6a8a"}}>{e.type}</span>{e.hydration&&<span> · 💧 {e.hydration} oz</span>}</div>
              </div>
              <span style={{color:"#3a4560",fontSize:18,transition:"transform 0.2s",transform:expId===e.id?"rotate(180deg)":"rotate(0)"}}>▼</span>
            </div>
            {expId===e.id&&<div style={{padding:"0 22px 18px",borderTop:"1px solid #1a2540",paddingTop:16}}>
              {e.hydration&&<div style={{marginBottom:10}}><div style={{color:"#4a7ccc",fontSize:12,fontWeight:700,letterSpacing:1,marginBottom:4}}>💧 HYDRATION</div><div style={{color:"#c8d0e0",fontSize:14}}>{e.hydration} oz</div></div>}
              {e.energy&&<div style={{marginBottom:10}}><div style={{color:"#f39c12",fontSize:12,fontWeight:700,letterSpacing:1,marginBottom:4}}>⚡ ENERGY LEVEL</div><div style={{color:"#c8d0e0",fontSize:14}}>{e.energy}/10</div></div>}
              {e.notes&&<div style={{marginBottom:10}}><div style={{color:"#5a6a8a",fontSize:12,fontWeight:700,letterSpacing:1,marginBottom:4}}>📝 NOTES</div><div style={{color:"#c8d0e0",fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{e.notes}</div></div>}
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button onClick={ev=>{ev.stopPropagation();edit(e)}} style={{...BS,padding:"6px 14px",fontSize:12,color:"#4a7ccc",borderColor:"#4a7ccc44"}}>✏️ Edit</button>
                <button onClick={ev=>{ev.stopPropagation();del(e.id)}} style={{...BS,padding:"6px 14px",fontSize:12,color:"#e63946",borderColor:"#e6394633"}}>🗑 Delete</button>
              </div></div>}
          </div>)}</div>}
      {showAdd&&<Modal title={editId?"EDIT MEAL":"LOG MEAL"} onClose={()=>{setSA(false);setEI(null)}}>
        <div style={{display:"grid",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div><label style={LS}>Date</label><input type="date" value={form.date} onChange={e=>setF({...form,date:e.target.value})} style={IS}/></div>
            <div><label style={LS}>Type</label><select value={form.type} onChange={e=>setF({...form,type:e.target.value})} style={IS}>{MEAL_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div></div>
          <div><label style={LS}>What Did You Eat?</label><textarea value={form.meal} onChange={e=>setF({...form,meal:e.target.value})} rows={3} placeholder="e.g. Grilled chicken, brown rice, broccoli, banana" style={{...IS,resize:"vertical"}}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div><label style={LS}>Hydration (oz)</label><input type="number" min="0" value={form.hydration} onChange={e=>setF({...form,hydration:e.target.value})} placeholder="e.g. 20" style={IS}/></div>
            <div><label style={LS}>Energy Level: <span style={{color:"#f39c12",fontWeight:700}}>{form.energy||"—"}</span>/10</label><input type="range" min="1" max="10" value={form.energy||5} onChange={e=>setF({...form,energy:e.target.value})} style={{width:"100%",marginTop:8}}/></div></div>
          <div><label style={LS}>Notes (optional)</label><textarea value={form.notes} onChange={e=>setF({...form,notes:e.target.value})} rows={3} placeholder="How did you feel? Any reactions? Goals for next time?" style={{...IS,resize:"vertical"}}/></div>
          <div style={{display:"flex",gap:12,marginTop:8}}><button onClick={doSave} style={BP}>{editId?"Update":"Save"}</button><button onClick={()=>{setSA(false);setEI(null)}} style={BS}>Cancel</button></div>
        </div></Modal>}
    </>}
    {view==="resources"&&<ResourceList storageKey={SK.nutrRes} categories={NUTR_RES_CATS} emptyIcon="🍎" placeholder="Search nutrition resources..." addLabel="Add Resource" modalTitle="Nutrition Resource"/>}
  </div>);
}

function App(){
  const[authed,setA]=useState(false);const[page,setP]=useState("home");
  const[statsD,setSD]=useState([]);const[journalD,setJD]=useState([]);
  const[dbReady,setDbR]=useState(false);
  const handleAuth=async()=>{
    setA(true);
    try{await loadFirebaseToLocal();}catch(e){console.error("Firebase load failed:",e);}
    setSD(ld(SK.stats)||[]);setJD(ld(SK.journal)||[]);
    setDbR(true);
  };
  useEffect(()=>{if(authed&&dbReady){setSD(ld(SK.stats)||[]);setJD(ld(SK.journal)||[])}},[authed,dbReady,page]);
  if(!authed)return<PasswordGate onAuth={handleAuth}/>;
  if(!dbReady)return(<div style={{minHeight:"100vh",background:"#0a0f1e",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={{fontSize:48}}>⚽</div><p style={{color:"#5a6a8a",fontSize:16,fontFamily:"'Outfit',sans-serif"}}>Loading data...</p></div>);
  return(<div style={{minHeight:"100vh",background:"linear-gradient(180deg,#0a0f1e 0%,#0d1526 100%)",fontFamily:"'Outfit',sans-serif"}}>
    <Nav active={page} setActive={setP}/>
    {page==="home"&&<Home stats={statsD} journal={journalD}/>}
    {page==="highlights"&&<Highlights/>}
    {page==="training"&&<Training/>}
    {page==="journal"&&<Journal/>}
    {page==="stats"&&<Stats/>}
    {page==="nutrition"&&<Nutrition/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
